<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">

    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>

    <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>

    <title>Document</title>
</head>
<body>


    <div data-role="page" id="home">
        <div data-role="header" data-position="fixed">
            <h1>My Mobile Site</h1>
        </div>
        <div data-role="content">
            <h2>Welcome</h2>
            <p>This is a simple mobile website using jQuery Mobile.</p>
            <a href="#about" data-role="button">About</a>
            <a href="#contact" data-role="button">Contact</a>
        </div>
        <div data-role="footer" data-position="fixed">
            <h4>Home Page</h4>
        </div>
    </div>
    
    <div data-role="page" id="about">
        <div data-role="header" data-position="fixed">
            <h1>About</h1>
        </div>
        <div data-role="content">
            <h2>About Us</h2>
            <p>This is the about page.</p>
            <a href="#home" data-role="button" data-rel="">Back Home</a>
        </div>
    </div>

    <div data-role="page" id="contact">
        <div data-role="header" data-position="fixed">
            <h1>Contact</h1>
        </div>
        <div data-role="content">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br><br>

            <a href="#home" data-role="button" data-rel="back">Back Home</a>
        </div>
    </div>


</body>
</html>
